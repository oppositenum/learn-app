services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: learning_tutor
      POSTGRES_USER: learning_tutor
      POSTGRES_PASSWORD: learning_tutor
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_tutor -d learning_tutor"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - learning_tutor_postgres:/var/lib/postgresql/data

volumes:
  learning_tutor_postgres:
