name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-unit:
    name: Go unit and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet Go packages
        run: go vet ./server/... ./schemas/...
      - name: Test Go unit packages
        run: go test -count=1 ./server/internal/... ./server/cmd/... ./schemas/...

  go-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: learning_tutor
          POSTGRES_PASSWORD: learning_tutor
          POSTGRES_DB: learning_tutor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learning_tutor -d learning_tutor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      TEST_DATABASE_URL: postgres://learning_tutor:learning_tutor@127.0.0.1:5432/learning_tutor?sslmode=disable
      GOFLAGS: -v
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test against real PostgreSQL
        run: go test -count=1 ./server/tests/integration
      - name: Reject skipped integration tests
        env:
          GOFLAGS: -json
        run: |
          set -o pipefail
          # Integration gate baseline: top-level PASS >= 67, FAIL = 0, SKIP = 0, and TestIntegrationDatabaseConfiguredInCI must pass in CI.
          report_path="${RUNNER_TEMP}/go-integration.json"
          go test -count=1 ./server/tests/integration | tee "${report_path}"
          jq -e -s '
            ([.[] | select(.Action == "pass" and .Test != null and (.Test | contains("/") | not))] | length) >= 67 and
            ([.[] | select(.Action == "fail" and .Test != null and (.Test | contains("/") | not))] | length) == 0 and
            ([.[] | select(.Action == "skip" and .Test != null)] | length) == 0 and
            any(.[]; .Action == "pass" and .Test == "TestIntegrationDatabaseConfiguredInCI")
          ' "${report_path}"

  web:
    name: Web tests, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
